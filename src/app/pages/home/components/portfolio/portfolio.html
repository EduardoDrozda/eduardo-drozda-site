<section
  id="portfolio"
  class="portfolio"
  role="region"
  aria-label="Seção de portfólio"
>
  <div class="portfolio__container">
    <!-- Cabeçalho da Seção -->
    <header class="portfolio__header">
      <h2 class="portfolio__title glitch"
          [attr.data-text]="titleSignal()"
          role="heading"
          aria-level="2">
        {{ titleSignal() }}
      </h2>
      <div class="portfolio__divider animate-neon-pulse" aria-hidden="true"></div>
      <p class="portfolio__subtitle">
        {{ subtitleSignal() }}
      </p>
    </header>

    <!-- Lista de projetos -->
    <div class="portfolio__grid" role="list">
      <article
        class="portfolio-card"
        *ngFor="let project of projects"
        role="listitem"
      >
        <div class="portfolio-card__preview">
          <img
            class="portfolio-card__image"
            [src]="project.desktopImage"
            [alt]="project.desktopAltSignal()"
            loading="lazy"
            width="1280"
            height="720"
          />
        </div>

        <div class="portfolio-card__body">
          <h3 class="portfolio-card__title">
            {{ project.titleSignal() }}
          </h3>
          <p class="portfolio-card__description">
            {{ project.descriptionSignal() }}
          </p>

          <ul
            class="portfolio-card__tags"
            [attr.aria-label]="tagsLabelSignal()"
          >
            <li
              class="portfolio-card__tag"
              *ngFor="let tech of project.techs"
            >
              {{ tech }}
            </li>
          </ul>
        </div>

        <footer class="portfolio-card__footer">
          <a
            class="portfolio-card__link"
            [href]="project.url"
            target="_blank"
            rel="noopener noreferrer"
          >
            {{ viewProjectSignal() }}
          </a>
        </footer>
      </article>
    </div>
  </div>
</section>
